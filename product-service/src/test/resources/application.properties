
# Disable Flyway for tests
spring.flyway.enabled=false

# Use an isolated in-memory H2 database for ALL tests
spring.datasource.url=jdbc:h2:mem:product_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Create and drop schema only inside the H2 test database
spring.jpa.hibernate.ddl-auto=create-drop
